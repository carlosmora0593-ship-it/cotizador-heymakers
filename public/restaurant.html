<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Nuvoor Restaurant</title>
  <style>
    :root{color-scheme:light dark;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f3f2ec;color:#193e35}
    body{min-height:100vh;margin:0;display:grid;place-items:center;padding:24px;box-sizing:border-box}
    main{width:min(520px,100%);padding:28px;border:1px solid #d8dfd2;border-radius:22px;background:#fffdf8;box-shadow:0 18px 55px #173d321c}
    h1{margin:0 0 8px;font-size:25px}p{color:#607369;line-height:1.55}
    a{display:inline-flex;min-height:44px;align-items:center;padding:0 17px;border-radius:12px;background:#205846;color:#fff;font-weight:700;text-decoration:none}
    a:focus-visible{outline:3px solid #54b7c8;outline-offset:3px}
  </style>
</head>
<body>
  <main>
    <h1>Nuvoor Restaurant</h1>
    <p>El restaurante ahora está en su página actualizada. Te llevaremos a ella en un momento.</p>
    <a id="restaurantLink" href="./restaurante/">Abrir Nuvoor Restaurant</a>
  </main>
  <script>
    (function(){
      var destino=new URL("./restaurante/",window.location.href);
      destino.search=window.location.search;
      destino.hash=window.location.hash;
      var enlace=document.getElementById("restaurantLink");
      enlace.href=destino.href;
      window.setTimeout(function(){window.location.replace(destino.href);},500);
    })();
  </script>
</body>
</html>
