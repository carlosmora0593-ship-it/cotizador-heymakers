<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0A7FA8">
<script src="config.js?v=20261002-1816"></script>
<style>:root{color-scheme:light dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Makers Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --ground:#EFF3F7; --surface:#FFFFFF; --surface-2:#F6F9FC; --surface-3:#E8EEF4;
  --line:#D9E1EA; --line-2:#BECAD6;
  --ink:#151A21; --ink-2:#4B5764; --ink-3:#77838F;
  --acento:#0A7FA8; --acento-2:#065B79; --acento-suave:#E2F1F8;
  --bien:#0E7A53; --bien-suave:#E0F3EB;
  --aviso:#96620A; --aviso-suave:#FBF0DB;
  --critico:#B01660; --critico-suave:#FBE5EF;
  --r1:#9AD8ED; --r2:#2BA3CB; --r3:#0A5E7D;
  --sombra:0 1px 2px rgba(18,28,38,.05), 0 10px 26px -14px rgba(18,28,38,.22);
  --rad:10px; --nav:236px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --ground:#0E1216; --surface:#171C22; --surface-2:#1E242B; --surface-3:#262E37;
  --line:#2A323B; --line-2:#3B454F;
  --ink:#ECF1F6; --ink-2:#A8B5C1; --ink-3:#7B8794;
  --acento:#43B5DC; --acento-2:#8AD3EC; --acento-suave:#123342;
  --bien:#41C48E; --bien-suave:#11352A;
  --aviso:#DFA342; --aviso-suave:#382A10;
  --critico:#F172A8; --critico-suave:#3A1128;
  --r1:#14536B; --r2:#2E9CC4; --r3:#8FD0E8;
  --sombra:0 1px 2px rgba(0,0,0,.4), 0 10px 26px -14px rgba(0,0,0,.6);
}}
:root[data-theme="dark"]{
  --ground:#0E1216; --surface:#171C22; --surface-2:#1E242B; --surface-3:#262E37;
  --line:#2A323B; --line-2:#3B454F;
  --ink:#ECF1F6; --ink-2:#A8B5C1; --ink-3:#7B8794;
  --acento:#43B5DC; --acento-2:#8AD3EC; --acento-suave:#123342;
  --bien:#41C48E; --bien-suave:#11352A;
  --aviso:#DFA342; --aviso-suave:#382A10;
  --critico:#F172A8; --critico-suave:#3A1128;
  --r1:#14536B; --r2:#2E9CC4; --r3:#8FD0E8;
  --sombra:0 1px 2px rgba(0,0,0,.4), 0 10px 26px -14px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);
  font-family:"IBM Plex Sans",-apple-system,Segoe UI,Roboto,sans-serif;font-size:14px;line-height:1.5}
h1,h2,h3{margin:0;font-family:Fredoka,"IBM Plex Sans",sans-serif;font-weight:500;letter-spacing:-.01em}
p{margin:0}
a{color:var(--acento-2)}
button{font:inherit;color:inherit}
.num,.mono{font-variant-numeric:tabular-nums}

.app{display:flex;min-height:100vh}
.side{width:var(--nav);flex:0 0 var(--nav);background:var(--surface);border-right:1px solid var(--line);
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;padding:18px 12px 12px}
.marca{display:flex;align-items:center;gap:10px;padding:0 8px 18px}
.logo{width:34px;height:34px;border-radius:9px;background:var(--ink);display:grid;
  grid-template-columns:1fr 1fr;overflow:hidden;flex:0 0 34px}
.logo i{display:block}
.logo i:nth-child(1){background:#06A1D7}.logo i:nth-child(2){background:#F51B95}
.logo i:nth-child(3){background:#FFEC30}.logo i:nth-child(4){background:var(--ink)}
.marca b{font-family:Fredoka,sans-serif;font-size:17px;font-weight:600;display:block}
.marca small{color:var(--ink-3);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;
  background:none;border:0;padding:9px 10px;border-radius:8px;cursor:pointer;text-align:left;
  color:var(--ink-2);font-weight:500}
.nav button:hover{background:var(--surface-2);color:var(--ink)}
.nav button[aria-current="true"]{background:var(--acento-suave);color:var(--acento-2);font-weight:600}
.nav .cuenta{font-size:11px;font-variant-numeric:tabular-nums;background:var(--surface-3);
  color:var(--ink-2);border-radius:20px;padding:1px 7px;font-weight:600}
.nav .cuenta.urge{background:var(--critico-suave);color:var(--critico)}
.nav button[aria-current="true"] .cuenta{background:var(--surface);color:var(--acento-2)}
.sidepie{margin-top:auto;padding:10px 6px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px}

main{flex:1;min-width:0;display:flex;flex-direction:column}
.barra{position:sticky;top:env(safe-area-inset-top,0px);z-index:8;background:var(--ground);
  border-bottom:1px solid var(--line);padding:16px 24px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.barra h1{font-size:21px;margin-right:auto}
.hoja{padding:22px 24px 60px;display:flex;flex-direction:column;gap:20px}
.aviso-demo{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--aviso-suave);
  color:var(--aviso);border:1px solid var(--line);border-radius:var(--rad);padding:9px 14px;font-size:12.5px;font-weight:500}

.tarjeta{background:var(--surface);border:1px solid var(--line);border-radius:var(--rad)}
.tarjeta>header{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tarjeta>header h2{font-size:15px;margin-right:auto}
.tarjeta>header .pista{color:var(--ink-3);font-size:12px}
.cuerpo{padding:16px}
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--surface);color:var(--ink-2);
  border:1px solid var(--line-2);border-radius:8px;padding:6px 12px;cursor:pointer;font-weight:500;
  font-size:13px;text-decoration:none}
.btn:hover{background:var(--surface-2);color:var(--ink)}
.btn.p{background:var(--acento);border-color:var(--acento);color:#fff}
.btn.p:hover{background:var(--acento-2);border-color:var(--acento-2);color:#fff}
.btn.mal{color:var(--critico);border-color:var(--line-2)}
.btn.mal:hover{background:var(--critico-suave)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,
.nav button:focus-visible,tbody tr:focus-visible,.pend:focus-visible{outline:2px solid var(--acento);outline-offset:2px}
input,select,textarea{background:var(--surface);color:var(--ink);border:1px solid var(--line-2);
  border-radius:8px;padding:7px 10px;font:inherit;font-size:13px;width:100%}
textarea{min-height:72px;resize:vertical}
label.f{display:block;font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;
  color:var(--ink-3);margin-bottom:5px}
.campo{display:flex;flex-direction:column}
.busca{max-width:260px}

.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;
  padding:2px 9px;border-radius:20px;white-space:nowrap}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;flex:0 0 6px}
.chip.bien{background:var(--bien-suave);color:var(--bien)}
.chip.aviso{background:var(--aviso-suave);color:var(--aviso)}
.chip.mal{background:var(--critico-suave);color:var(--critico)}
.chip.gris{background:var(--surface-3);color:var(--ink-2)}
.chip.info{background:var(--acento-suave);color:var(--acento-2)}
.plan{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:6px;
  border:1px solid var(--line-2);color:var(--ink-2);white-space:nowrap}
.plan.basico{border-color:var(--r2);color:var(--acento-2)}
.plan.maker{border-color:var(--r2);background:var(--acento-suave);color:var(--acento-2)}
.plan.pro{border-color:var(--ink);background:var(--ink);color:var(--surface)}

.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--rad);padding:16px 18px;
  display:flex;flex-direction:column;gap:5px}
.tile .et{font-size:11.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3)}
.tile .v{font-family:Fredoka,sans-serif;font-size:31px;font-weight:500;letter-spacing:-.02em;
  font-variant-numeric:tabular-nums;line-height:1.1}
.tile .sub{font-size:12px;color:var(--ink-2)}
.tile.destacada{border-left:3px solid var(--acento)}

.marco{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;min-width:660px;font-size:13px}
th{text-align:left;font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;
  color:var(--ink-3);padding:9px 14px;border-bottom:1px solid var(--line);white-space:nowrap;
  background:var(--surface-2);position:sticky;top:0}
td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr.clic{cursor:pointer}
tbody tr.clic:hover td{background:var(--surface-2)}
tbody tr:last-child td{border-bottom:0}
td.der,th.der{text-align:right;font-variant-numeric:tabular-nums}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:12px;color:var(--ink-2)}
.taller{font-weight:600;color:var(--ink)}
.sitio{font-size:11.5px;color:var(--ink-3)}

.pendientes{display:flex;flex-direction:column}
.pend{display:flex;gap:12px;align-items:center;padding:11px 16px;border-bottom:1px solid var(--line)}
.pend.clic{cursor:pointer}
.pend:last-child{border-bottom:0}
.pend.clic:hover{background:var(--surface-2)}
.pend .raya{width:3px;align-self:stretch;border-radius:3px;background:var(--ink-3);flex:0 0 3px}
.pend.urge .raya{background:var(--critico)}
.pend.pronto .raya{background:var(--aviso)}
.pend.info .raya{background:var(--acento)}
.pend.ok .raya{background:var(--bien)}
.pend .txt{flex:1;min-width:0}
.pend .txt b{display:block;font-size:13.5px}
.pend .txt small{color:var(--ink-2);font-size:12px;display:block}
.vacio{padding:28px 16px;text-align:center;color:var(--ink-3);font-size:13px}

.graf{display:block;width:100%;height:auto;overflow:visible}
.leyenda{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);margin-top:12px}
.leyenda span{display:inline-flex;align-items:center;gap:6px}
.leyenda i{width:11px;height:11px;border-radius:3px;display:inline-block}
.globo{position:fixed;z-index:60;pointer-events:none;background:var(--ink);color:var(--ground);
  border-radius:7px;padding:7px 10px;font-size:12px;line-height:1.35;box-shadow:var(--sombra);white-space:nowrap}

.telon{position:fixed;inset:0;background:rgba(10,16,22,.42);z-index:40;opacity:0;transition:opacity .18s}
.telon[hidden]{display:none!important}
.ficha{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--surface);
  border-left:1px solid var(--line);z-index:50;display:flex;flex-direction:column;
  transform:translateX(100%);transition:transform .22s cubic-bezier(.2,.8,.3,1);box-shadow:var(--sombra)}
.ficha.abierta{transform:none}
.ficha>header{display:flex;align-items:flex-start;gap:12px;padding:18px 20px;border-bottom:1px solid var(--line)}
.ficha>header h2{font-size:19px}
.ficha .desliza{overflow:auto;padding:18px 20px 40px;display:flex;flex-direction:column;gap:16px;flex:1}
.pares{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:12px;margin:0}
.par{display:flex;flex-direction:column;gap:2px}
.par dt{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3)}
.par dd{margin:0;font-size:14px;font-variant-numeric:tabular-nums}
.bloque{border:1px solid var(--line);border-radius:var(--rad);padding:14px;display:flex;flex-direction:column;gap:11px}
.bloque h3{font-size:12px;font-family:"IBM Plex Sans",sans-serif;font-weight:700;
  letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3)}
.bloque.jugada{border-left:3px solid var(--acento);background:var(--surface-2)}
.bloque.jugada.urge{border-left-color:var(--critico)}
.bloque.jugada.pronto{border-left-color:var(--aviso)}
.bloque.jugada h4{margin:0;font-size:16px;font-family:Fredoka,sans-serif;font-weight:500}
.porque{font-size:12.5px;color:var(--ink-2)}
.guion{background:var(--surface);border:1px dashed var(--line-2);border-radius:8px;padding:11px 12px;
  font-size:13px;line-height:1.5;color:var(--ink-2);white-space:pre-wrap}
.fila{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.hist{display:flex;flex-direction:column;gap:9px;max-height:210px;overflow:auto}
.hist div{display:flex;gap:9px;font-size:12.5px;color:var(--ink-2);line-height:1.45}
.hist time{color:var(--ink-3);font-family:"IBM Plex Mono",monospace;font-size:11px;flex:0 0 74px}
.hilo{display:flex;flex-direction:column;gap:10px}
.msg{border-radius:9px;padding:9px 12px;font-size:13px;background:var(--surface-2);border:1px solid var(--line)}
.msg.mio{background:var(--acento-suave);border-color:var(--acento-suave)}
.msg b{display:block;font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3);margin-bottom:3px}
.senal{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;padding:5px 0;border-bottom:1px solid var(--line)}
.senal:last-child{border-bottom:0}
.senal b{font-variant-numeric:tabular-nums;font-weight:600}
.senal.mala b{color:var(--critico)}
.senal.tibia b{color:var(--aviso)}
.senal.buena b{color:var(--bien)}
.apoyo{background:var(--aviso-suave);color:var(--aviso);border-radius:8px;padding:8px 11px;font-size:12.5px;font-weight:600}
.seg{display:inline-flex;gap:4px;background:var(--surface);border:1px solid var(--line);
  border-radius:10px;padding:4px;flex-wrap:wrap}
.seg button{background:none;border:0;border-radius:7px;padding:6px 13px;cursor:pointer;
  color:var(--ink-2);font-weight:500;font-size:13px;display:inline-flex;align-items:center;gap:7px}
.seg button:hover{background:var(--surface-2);color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--acento-suave);color:var(--acento-2);font-weight:600}
.rejilla2{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:20px;align-items:start}
.nota{font-size:12.5px;color:var(--ink-2);line-height:1.55;max-width:70ch}

@media (max-width:860px){
  .app{flex-direction:column}
  .side{width:auto;flex:none;height:auto;position:static;flex-direction:row;align-items:center;
    gap:10px;padding:10px 16px;border-right:0;border-bottom:1px solid var(--line);overflow-x:auto}
  .marca{padding:0;flex:0 0 auto}
  .marca .txt{display:none}
  .nav{flex-direction:row;gap:4px;flex:1}
  .nav button{white-space:nowrap;padding:7px 11px}
  .nav .cuenta{display:none}
  .sidepie{display:none}
  .barra{padding:14px 16px}
  .hoja{padding:16px 16px 60px}
  .busca{max-width:none;flex:1}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---- la puerta de Makers Lab ---- */
body.sin-sesion .app,
body.sin-sesion .ficha,
body.sin-sesion .telon{display:none!important}
.puerta{position:fixed;inset:0;z-index:200;background:var(--ground);display:grid;place-items:center;padding:20px 16px;overflow:auto}
.puertaCard{width:min(430px,100%);background:var(--surface);border:1px solid var(--line);border-radius:16px;
  box-shadow:var(--sombra);padding:30px;display:flex;flex-direction:column;gap:6px}
.puertaCard .logo{margin-bottom:10px}
.puertaCard h1{font-family:"Fredoka",system-ui,sans-serif;font-size:24px;font-weight:600;margin:0}
.puertaCard p{color:var(--ink-2);font-size:14px;line-height:1.55;margin:0 0 12px}
.puertaCard form{display:flex;flex-direction:column;gap:6px}
.plan.ninguno{border-color:var(--line-2);background:transparent;color:var(--ink-3)}
.plan.prueba{border-color:var(--aviso);background:var(--aviso-suave);color:var(--aviso)}
.puertaCard label.f{font-size:11px;font-weight:600;color:var(--ink-2);text-transform:uppercase;letter-spacing:.06em;margin-top:8px}
.puertaCard button[type=submit]{margin-top:16px;justify-content:center}
.puertaMsg{margin-top:12px!important;color:var(--critico);font-size:13px;font-weight:500}
.puertaPie{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.labPie{font-size:11px;color:var(--ink-3);line-height:1.5;margin:10px 0 0}
</style>

</head>
<body class="sin-sesion">

<div class="puerta" id="labPuerta" hidden>
  <div class="puertaCard">

      <button class="btn sm" id="puertaSalir" hidden>Salir de esta sesión</button>
    </div>
  </div>
</div>
<div class="app">
  <nav class="side">
    <div class="marca">
      <span class="logo" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
      <span class="txt"><b>Makers Lab</b><small>Hey Makers</small></span>
    </div>
    <div class="nav" id="nav">
      <button data-v="tablero" aria-current="true">Tablero</button>
      <button data-v="cuentas">Cuentas <span class="cuenta" id="n_cuentas">0</span></button>

      <button data-v="soporte">Soporte <span class="cuenta" id="n_soporte">0</span></button>
      <button data-v="cobros">Cobros <span class="cuenta" id="n_cobros">0</span></button>
      <button data-v="codigos">Códigos</button>
      <button data-v="diagnosticos">Diagnósticos</button>
      <button data-v="equipo">Equipo</button>
      <button data-v="numeros">Números</button>
    </div>
    <div class="sidepie">
      <button class="btn sm" id="btnExporta">Exportar cuentas</button>
      <button class="btn sm" id="labCotizador">Ir al cotizador</button>
      <button class="btn sm mal" id="labSalir">Salir</button>
      <p class="labPie"><span id="labQuien"></span><br><span id="labVersion"></span></p>
    </div>
  </nav>

  <main>
    <div class="barra">
      <h1 id="titulo">Tablero</h1>
      <input class="busca" id="busca" type="search" placeholder="Buscar taller, correo o ciudad" hidden>
      <select id="filtroEstado" style="width:auto" hidden></select>
      <select id="filtroPlan" style="width:auto" hidden></select>
      <button class="btn p" id="btnNueva" hidden>Alta manual</button>
    </div>
    <div class="hoja">
      <div class="aviso-demo" id="avisoDemo" hidden>
        Ves cuántas cuentas hay, en qué plan están y cuánto usan. Las cotizaciones, los clientes y los precios de cada taller no salen de su cuenta: ni aquí ni en ningún lado.
      </div>
      <div id="vista"></div>
    </div>
  </main>
</div>

<div class="telon" id="telon" hidden></div>
<aside class="ficha" id="ficha" aria-label="Detalle" aria-hidden="true"></aside>

<script>
"use strict";
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => Math.random().toString(36).slice(2, 9);

const PLANES = {
  ninguno: { nombre: "Sin plan",     mes: 0,   anio: 0 },
  prueba:  { nombre: "Prueba Maker", mes: 0,   anio: 0 },
  basico: { nombre: "Básico", mes: 199, anio: 1990 },
  maker:  { nombre: "Maker",  mes: 449, anio: 4490 },
  pro:    { nombre: "Pro",    mes: 899, anio: 8990 }

/* ================= almacén ================= */
async function arranca() {
  try { DB = await (window.claude && window.claude.use ? window.claude.use("db") : null); } catch (e) { DB = null; }
  if (!DB) { generaEjemplo(true); listo = true; pinta(); return; }
  const cfg = await DB.doc("meta/config").get().catch(() => ({ exists: false }));
  if (cfg.exists) CFG = Object.assign(CFG, cfg.data());
  const meta = await DB.doc("meta/estado").get().catch(() => ({ exists: false }));
  if (!meta.exists) {
    const l = await DB.doc("meta/semilla").acquire({ holder: "arranque", ttlMs: 20000 }).catch(() => ({ acquired: true }));
    if (l.acquired) await siembra();
  } else {
    esEjemplo = !!(meta.data() || {}).ejemplo;
  }
  COLS.forEach(col => {
    DB.collection(col).onSnapshot(snap => {
      ficheros[col] = snap.docs.map(d => Object.assign({ id: d.id }, d.data()));
      listo = true; pinta();
    }, () => { listo = true; pinta(); });
  });
  setTimeout(() => { if (!listo) { listo = true; pinta(); } }, 4000);
}

async function siembra() {
  const d = generaEjemplo(false), tareas = [];
  COLS.forEach(col => (d[col] || []).forEach(r => {
    const cuerpo = Object.assign({}, r); delete cuerpo.id;
    tareas.push(DB.collection(col).doc(r.id).set(cuerpo));
  }));
  tareas.push(DB.doc("meta/estado").set({ ejemplo: true, creado: iso(HOY) }));
  try { await Promise.all(tareas); } catch (e) {}
  esEjemplo = true;
}

async function guarda(col, reg) {
  const cuerpo = Object.assign({}, reg); delete cuerpo.id;
  const i = ficheros[col].findIndex(x => x.id === reg.id);
  if (i >= 0) ficheros[col][i] = reg; else ficheros[col].push(reg);
  pinta();
  if (DB) { try { await DB.collection(col).doc(reg.id).set(cuerpo); } catch (e) { aviso("No se guardó: " + (e && e.message ? e.message : "error desconocido")); console.error("Al guardar en", col, e); } }
}
async function elimina(col, id) {
  ficheros[col] = ficheros[col].filter(x => x.id !== id);
  pinta();
  if (DB) { try { await DB.collection(col).doc(id).delete(); } catch (e) {} }
}

/* ================= avisos ================= */
function aviso(txt) {
  let el = document.querySelector(".globo.fijo");
  if (!el) { el = document.createElement("div"); el.className = "globo fijo"; document.body.appendChild(el); }
  el.textContent = txt;
  el.style.left = "50%"; el.style.top = "auto"; el.style.bottom = "24px"; el.style.transform = "translateX(-50%)";
  clearTimeout(el._t); el._t = setTimeout(() => el.remove(), 3400);
}

/* ================= pendientes ================= */
function pendientes() {
  const l = [];
  ficheros.cuentas.forEach(c => {
    const j = jugada(c);
    if (j.urg === "urge" || j.urg === "pronto")
      l.push({ p: j.urg === "urge" ? 0 : 2, cls: j.urg, id: c.id, t: c.taller + ": " + j.titulo.toLowerCase(), s: j.porque });
  });
  ficheros.tickets.filter(t => t.estado !== "resuelto" && t.prioridad === "alta").forEach(t => {
    const c = cuentaDe(t.cuentaId);
    l.push({ p: 1, cls: "urge", tick: t.id, t: (c ? c.taller : "Cuenta") + ": " + t.asunto,
      s: "Ticket urgente abierto el " + fFecha(t.creado) + "." });
  });
  ficheros.fallas.filter(f => f.severidad === "bloquea" && f.estado !== "verificada" && f.estado !== "corregida").forEach(f => {
    const af = afectadasDe(f);
    l.push({ p: 0, cls: "urge", falla: f.id, t: "Falla que bloquea: " + f.titulo,
      s: af.length ? "Le pega a " + af.length + (af.length === 1 ? " cuenta" : " cuentas") + " · " + PASOS[f.estado].que
                   : PASOS[f.estado].que });
  });
  ficheros.fallas.filter(f => f.estado === "corregida" && !f.avisados).forEach(f => {
    l.push({ p: 2, cls: "pronto", falla: f.id, t: "Ya se arregló y el cliente no sabe: " + f.titulo,
      s: "Salió en la versión " + f.version + ". Avisarles cierra sus tickets." });
  });
  ficheros.cobros.filter(p => p.estado === "rechazado").forEach(p => {
    const c = cuentaDe(p.cuentaId);
    l.push({ p: 0, cls: "urge", id: p.cuentaId, t: (c ? c.taller : "Cuenta") + ": el cobro fue rechazado",
      s: $$$(cargo(p)) + " el " + fFecha(p.fecha) + " con " + p.metodo.toLowerCase() + "." });
  });
  return l.sort((a, b) => a.p - b.p);
}

/* ================= gráficas ================= */
function historico(meses) {
  const out = [];
  for (let i = meses - 1; i >= 0; i--) {
    const f = new Date(HOY.getFullYear(), HOY.getMonth() - i + 1, 0), corte = iso(f);
    let total = 0;
    ficheros.cuentas.forEach(c => {
      if (c.estado === "prueba") return;
      if (difDias(corte, c.alta) < 0) return;
      const fin = c.baja || (paga(c) ? null : c.vence);
      if (fin && difDias(corte, fin) >= 0) return;
      total += mensual(c);

}
function grafIngreso() {
  const d = historico(6); if (!d.length) return "";
  const W = 640, H = 200, ejeI = 54, ejeB = 26, top = 12;
  const max = Math.max(1, Math.max.apply(null, d.map(x => x.v))) * 1.15;
  const ancho = (W - ejeI - 8) / d.length, barra = Math.min(46, ancho * 0.56);
  let s = '<svg class="graf" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Ingreso recurrente de los últimos seis meses">';
  for (let i = 0; i <= 2; i++) {
    const v = max * i / 2, y = top + (H - top - ejeB) * (1 - i / 2);
    s += '<line x1="' + ejeI + '" y1="' + y.toFixed(1) + '" x2="' + (W - 4) + '" y2="' + y.toFixed(1) + '" stroke="var(--line)" stroke-width="1"/>' +
      '<text x="' + (ejeI - 8) + '" y="' + (y + 4).toFixed(1) + '" text-anchor="end" font-size="11" fill="var(--ink-3)" font-family="IBM Plex Mono, monospace">' +
      (v >= 1000 ? Math.round(v / 1000) + "k" : Math.round(v)) + '</text>';
  }
  d.forEach((p, i) => {
    const alto = Math.max(2, (H - top - ejeB) * (p.v / max));
    const x = ejeI + i * ancho + (ancho - barra) / 2, y = H - ejeB - alto;
    s += '<rect class="barra" data-i="' + i + '" x="' + x.toFixed(1) + '" y="' + y.toFixed(1) + '" width="' + barra.toFixed(1) +
      '" height="' + alto.toFixed(1) + '" rx="4" fill="var(--acento)"/>' +
      '<text x="' + (x + barra / 2).toFixed(1) + '" y="' + (H - 8) + '" text-anchor="middle" font-size="11" fill="var(--ink-3)">' + p.et + '</text>';
    if (i === d.length - 1) s += '<text x="' + (x + barra / 2).toFixed(1) + '" y="' + (y - 6).toFixed(1) +
      '" text-anchor="middle" font-size="12" font-weight="600" fill="var(--ink)" font-family="IBM Plex Mono, monospace">' + $$$(p.v) + '</text>';
  });
  return s + '</svg>';
}
function grafPlanes() {
  const act = ficheros.cuentas.filter(paga);
  const ord = ["basico", "maker", "pro"], col = ["var(--r1)", "var(--r2)", "var(--r3)"];
  const por = ord.map(p => ({ p, n: act.filter(c => c.plan === p).length, v: act.filter(c => c.plan === p).reduce((s, c) => s + mensual(c), 0) }));
  const tot = por.reduce((s, x) => s + x.v, 0) || 1;
  const W = 640, H = 46; let x = 0;
  let s = '<svg class="graf" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Reparto del ingreso por plan">';
  por.forEach((q, i) => {
    const w = Math.max(0, (W * q.v / tot) - (i < 2 ? 2 : 0));
    if (w > 0) {
      s += '<rect x="' + x.toFixed(1) + '" y="0" width="' + w.toFixed(1) + '" height="28" rx="4" fill="' + col[i] + '"/>';
      if (w > 62) s += '<text x="' + (x + w / 2).toFixed(1) + '" y="' + (H - 4) + '" text-anchor="middle" font-size="11" fill="var(--ink-2)" font-family="IBM Plex Mono, monospace">' +
        Math.round(q.v / tot * 100) + '%</text>';
    }
    x += w + 2;
  });
  return s + '</svg><div class="leyenda">' + por.map((q, i) =>
    '<span><i style="background:' + col[i] + '"></i>' + PLANES[q.p].nombre + ' · ' + q.n + (q.n === 1 ? " cuenta" : " cuentas") + ' · ' + $$$(q.v) + '</span>').join("") + '</div>';
}

function comisionDe(e) {
  const mes = iso(HOY).slice(0, 7);
  const suyas = ficheros.cuentas.filter(c => c.cerradoPor === e.id);
  const pagando = suyas.filter(paga);
  const nuevas = suyas.filter(c => c.alta.slice(0, 7) === mes && paga(c));
  let monto = 0;
  if (e.comision.tipo === "primermes") monto = nuevas.reduce((s, c) => s + mensual(c) * e.comision.valor / 100, 0);
  else if (e.comision.tipo === "recurrente") monto = pagando.reduce((s, c) => s + mensual(c) * e.comision.valor / 100, 0);
  return { total: suyas.length, pagando: pagando.length, nuevas: nuevas.length, monto: monto, cuentas: nuevas };
}
const tratoDe = e => e.comision.tipo === "primermes" ? "El primer mes de cada cuenta que cierre"
  : e.comision.tipo === "recurrente" ? e.comision.valor + "% de lo que paguen sus cuentas, cada mes" : "Sin comisión";

/* Qué trae encima cada persona. Es la pregunta que se hace el dueño cuando ya
   no lo hace todo él: quién está saturado y qué quedó sin dueño. */
function cargaDe(e) {
  const mes = iso(HOY).slice(0, 7);
  const cuentas = ficheros.cuentas.filter(c => c.cerradoPor === e.id);
  const citas = ficheros.citas.filter(q => q.quien === e.id);
  const tks = ficheros.tickets.filter(t => t.atiende === e.id);
  const urg = cuentas.filter(c => jugada(c).urg === "urge");
  return {
    cuentas: cuentas, pagando: cuentas.filter(paga).length,
    prueba: cuentas.filter(c => c.estado === "prueba").length,
    urgentes: urg.length, urg: urg,
    cerradasMes: cuentas.filter(c => c.alta.slice(0, 7) === mes && paga(c)).length,
    citasPend: citas.filter(q => q.estado === "pendiente"),
    citasHoy: citas.filter(q => q.estado === "pendiente" && difDias(q.fecha, iso(HOY)) <= 0).length,
    citasHechas: citas.filter(q => q.estado === "hecha").length,
    citasNoHubo: citas.filter(q => q.estado === "nohubo").length,
    tickets: tks, tkAbiertos: tks.filter(t => t.estado !== "resuelto"),
    tkEsperando: tks.filter(t => t.estado === "esperando").length,
    fallas: ficheros.fallas.filter(f => f.quien === e.id && f.estado !== "verificada")
  };
}

function vNumeros() {
  const tot = ficheros.cuentas.length;
  const pagando = ficheros.cuentas.filter(paga);
  const enPrueba = ficheros.cuentas.filter(c => c.estado === "prueba").length;
  const salieron = ficheros.cuentas.filter(c => c.estado === "baja" || c.estado === "vencida");
  const conv = tot ? Math.round(pagando.length / Math.max(1, tot - enPrueba) * 100) : 0;
  const act = tot ? Math.round(ficheros.cuentas.filter(c => c.cotizaciones >= 3).length / tot * 100) : 0;
  const bajas = tot ? Math.round(salieron.length / tot * 100) : 0;
  const anuales = pagando.filter(c => c.periodo === "anual").length;
  const porOrigen = ["curso", "alianza", "referido", "organico"].map(o => ({
    o, n: ficheros.cuentas.filter(c => c.origen === o).length,
    pagan: ficheros.cuentas.filter(c => c.origen === o && paga(c)).length,
    v: ficheros.cuentas.filter(c => c.origen === o && paga(c)).reduce((s, c) => s + mensual(c), 0)
  }));

  return '<div style="display:flex;flex-direction:column;gap:20px">' +
    '<div class="tiles">' +
      tile("Conversión a pago", conv + "%", "de las pruebas que ya terminaron", true) +
      tile("Activación", act + "%", "hizo 3 o más cotizaciones") +
      tile("Se han ido", bajas + "%", salieron.length + " entre bajas y vencidas") +
      tile("Pagan anual", anuales, "de " + pagando.length + " cuentas que pagan") +
    '</div>' +
    '<div class="rejilla2">' +
      '<div class="tarjeta"><header><h2>De dónde llegan</h2><span class="pista">y cuáles pagan</span></header>' +
        '<div class="marco"><table style="min-width:420px"><thead><tr><th>Canal</th><th class="der">Cuentas</th><th class="der">Pagan</th><th class="der">Al mes</th></tr></thead><tbody>' +
        porOrigen.map(x => '<tr><td class="taller">' + ORIGENES[x.o] + '</td><td class="der mono">' + x.n + '</td>' +
          '<td class="der mono">' + x.pagan + '</td><td class="der mono">' + $$$(x.v) + '</td></tr>').join("") +
        '</tbody></table></div></div>' +
      '<div class="tarjeta"><header><h2>Ingreso recurrente</h2><span class="pista">últimos 6 meses</span></header><div class="cuerpo">' + grafIngreso() + '</div></div>' +
    '</div>' +
    '<div class="tarjeta"><header><h2>Qué mirar aquí</h2></header><div class="cuerpo"><p class="nota">' +
      'La <b>activación</b> es la que manda: si alguien no llega a tres cotizaciones, no se queda, y eso no se arregla bajando el precio ' +
      'sino arreglando el arranque. La <b>conversión</b> dice si el plan Básico está bien puesto. Las <b>bajas</b> importan por su razón, ' +
      'no por su número: llámales.</p></div></div></div>';
}

/* La IA le propone la respuesta a quien da soporte, nunca se la manda sola al
   cliente. Así ayuda con la velocidad sin poder inventarle nada a nadie. */
let IA = undefined;
async function prendeSugerencia() {
  const b = $("#btnSug"); if (!b) return;
  if (IA === undefined) { try { IA = await (window.claude && window.claude.use ? window.claude.use("sample") : null); } catch (e) { IA = null; } }
  if (IA) b.hidden = false;
}

  const b = $("#btnSug"); if (b) { b.disabled = true; b.textContent = "Pensando…"; }
  const ta = $("#tkResp");
  const saber =
    "Eres quien da soporte del cotizador Hey Makers, una herramienta mexicana para talleres de playeras, gorras y tazas. " +
    "Reglas del producto que debes respetar:\n" +
    "- Los archivos de diseño solo pueden ser PNG, JPG o WebP de hasta 5 MB. Los de preprensa (AI, PSD, PDF de impresión, TIFF, CDR) se rechazan a propósito.\n" +
    "- La orden de producción, con su folio OP, nace solo cuando se confirma el pedido, no al guardar la cotización.\n" +
    "- El paso 3 de tallas solo aparece si el artículo es textil.\n" +
    "- Producción nunca ve precios. Ventas no mueve el estatus de una orden.\n" +
    "- Las existencias del inventario solo se mueven con requisición y su archivo adjunto.\n" +
    "- El precio sale de la utilidad, la merma y la mano de obra que estén en Ajustes, más el costo del artículo y el mínimo de la técnica.\n\n" +
    "Escribe la respuesta para este cliente. En español de México, de tú, cálida y breve: máximo 4 renglones. " +
    "Nada de 'estimado cliente' ni de disculpas largas. Ve al grano y dile qué hacer.\n" +
    "Si es una falla del programa, dilo con todas sus letras y no inventes pasos para darle la vuelta.\n" +
    "Si te falta un dato para resolverlo, pregúntalo en una sola pregunta concreta.\n" +
    "Nunca inventes menús, botones ni pantallas que no estén en las reglas de arriba.\n\n" +
    "TALLER: " + (c.taller || "") + " · plan " + planDe(c).nombre + " · versión " + (c.version || "?") + " · " + (c.navegador || "") + "\n" +
    "PANTALLA DONDE PASÓ: " + (t.pantalla || (t.contexto || {}).pantalla || "no dice") + "\n" +
    (t.bloquea ? "EL CLIENTE DICE QUE NO PUEDE TRABAJAR.\n" : "") +
    ((t.errores || []).length ? "ERRORES TÉCNICOS DE SU SESIÓN:\n" + t.errores.map(x => "- " + x.msg).join("\n") + "\n" : "") +
    (f ? "YA SABEMOS QUE ES UNA FALLA NUESTRA: \"" + f.titulo + "\". Estado: " + PASOS[f.estado].nombre +
         (f.version ? ", " + (f.estado === "corregida" || f.estado === "verificada" ? "salió corregida en la versión " : "va para la versión ") + f.version : "") + ".\n" : "") +
    "\nCONVERSACIÓN:\n" + (t.mensajes || []).map(m => (m.de === "cliente" ? "CLIENTE: " : "NOSOTROS: ") + m.txt).join("\n");
  try {
    const r = await IA(saber, { modelTier: "quick", onText: o => { if (ta) ta.value = o.text; } });
    if (ta) { ta.value = (r && r.text ? r.text : ta.value).trim(); ta.focus(); }
    const n = $("#sugNota"); if (n) n.hidden = false;
  } catch (err) {
    const cod = err && err.code;
    aviso(cod === "not_granted" ? "Falta autorizar la ayuda de la IA" : cod === "rate_limited" ? "La IA está saturada, intenta en un momento" : "No se pudo proponer una respuesta");
  }
  if (b) { b.disabled = false; b.textContent = "Proponme otra"; }
}

function muestraPanel() {
  const f = $("#ficha"), t = $("#telon");
  t.hidden = false; requestAnimationFrame(() => { t.style.opacity = "1"; f.classList.add("abierta"); });
  f.setAttribute("aria-hidden", "false");
  const b = f.querySelector("#cerrarFicha"); if (b) b.focus();
}
function cierraPanel() {
  const f = $("#ficha"), t = $("#telon");
  f.classList.remove("abierta"); f.setAttribute("aria-hidden", "true");
  t.style.opacity = "0"; setTimeout(() => { t.hidden = true; }, 200);
  abierta = null;
}

/* ================= fallas ================= */
function anotaFalla(f, t) { f.notas = f.notas || []; f.notas.unshift({ f: iso(HOY), t: t }); if (f.notas.length > 30) f.notas.length = 30; }

async function accionFalla(acc) {
  const f = fallaDe(fallaAbierta); if (!f) return;

  if (acc === "copiareporte") {
    const af = afectadasDe(f);
    const txt = "FALLA: " + f.titulo + "\n\nDónde: " + f.donde +
      "\nSeveridad: " + SEVERIDAD[f.severidad].nombre +
      "\n\nQué le pasa al cliente:\n" + f.sintoma +
      "\n\nCómo se reproduce:\n" + f.reproducir +
      "\n\nDetectada automáticamente " + vecesDe(f) + " veces." +
      "\nCuentas afectadas (" + af.length + "): " + af.map(c => c.taller + " [v" + c.version + ", " + c.navegador + "]").join("; ") +
      "\n\nErrores en consola:\n" + erroresDe(f).map(e => "- " + e.mensaje + " (" + e.donde + ", " + e.navegador + ", v" + e.version + ")").join("\n");
    try { await navigator.clipboard.writeText(txt); aviso("Reporte copiado"); }
    catch (e) { aviso("No se pudo copiar. Selecciónalo a mano."); }
    return;
  }
  if (acc === "nota") {
    const t = ($("#fxNota").value || "").trim();
    if (!t) { aviso("Escribe la nota primero."); return; }
    anotaFalla(f, t);
  } else if (acc === "confirma") {
    f.estado = "confirmada"; f.confirmada = iso(HOY); anotaFalla(f, "Se logró reproducir.");
  } else if (acc === "arreglando") {
    f.estado = "arreglando"; anotaFalla(f, "Alguien la está corrigiendo.");
    const v = prompt("¿En qué versión va a salir?", "21"); if (v) f.version = v.trim();
  } else if (acc === "corregida") {
    const v = prompt("¿En qué versión salió corregida?", f.version || "21"); if (!v) return;
    f.version = v.trim(); f.estado = "corregida"; f.corregida = iso(HOY); f.avisados = false;
    if (!f.confirmada) f.confirmada = iso(HOY);
    anotaFalla(f, "Corregida y publicada en la versión " + f.version + ".");
    aviso("Falta avisarles: es lo que cierra sus tickets");
  } else if (acc === "avisa") {
    const af = afectadasDe(f), tks = ticketsDe(f);
    for (const t of tks) {
      t.mensajes = (t.mensajes || []).concat([{ de: "soporte", f: ahoraSello(),
        txt: "Ya quedó: era una falla nuestra (" + f.titulo.toLowerCase() + ") y salió corregida en la versión " + f.version +
             ". Recarga la página y pruébalo, y me dices si ya te funciona." }]);
      if (!t.primeraResp) t.primeraResp = ahoraSello();
      t.resuelto = ahoraSello(); t.estado = "esperando";
      await guarda("tickets", t);
    }
    for (const c of af) { anota(c, "Se le avisó que la falla \"" + f.titulo + "\" salió corregida en la versión " + f.version + "."); await guarda("cuentas", c); }
    f.avisados = true; anotaFalla(f, "Se avisó a " + af.length + " cuenta(s) afectada(s).");
    aviso("Avisados. Sus tickets quedaron esperando confirmación.");
  } else if (acc === "verifica") {
    f.estado = "verificada"; f.verificada = iso(HOY); anotaFalla(f, "El cliente confirmó que ya quedó.");
  } else if (acc === "reabre") {
    f.estado = "confirmada"; f.corregida = null; f.verificada = null; f.avisados = false;
    anotaFalla(f, "Volvió a pasar después de darla por corregida.");
    aviso("Reabierta");
  }
  await guarda("fallas", f);
  abreFalla(f.id);
}

/* ================= facturación ================= */
async function emiteCFDI(pagoId, silencioso) {
  const p = ficheros.cobros.find(x => x.id === pagoId); if (!p) return false;
  const c = cuentaDe(p.cuentaId) || {};
  if (!c.rfc || !c.razon || !c.cp || !c.regimen) {
    if (!silencioso) aviso("Primero captura los datos fiscales de " + (c.taller || "la cuenta") + ".");
    return false;
  }
  CFG.folio++;
  p.factura = "emitida";
  p.cfdi = CFG.serie + "-" + CFG.folio;
  p.uuid = "F3B" + String(100000 + CFG.folio * 7) + "-CDA4";
  p.emitida = iso(HOY);
  p.enviada = true;
  await guardaCfg();
  await guarda("cobros", p);
  anota(c, "Se emitió el CFDI " + p.cfdi + " por " + $$$(cargo(p)) + " y se envió a " + (c.correo || "su correo") + ".");
  await guarda("cuentas", c);
  if (!silencioso) aviso("CFDI " + p.cfdi + " emitido y enviado a " + (c.correo || "su correo"));
  return true;
}
async function guardaCfg() {
  if (DB) { try { await DB.doc("meta/config").set(CFG); } catch (e) {} }
}

/* ================= acciones ================= */
async function accion(acc) {
  const c = cuentaDe(abierta); if (!c) return;
  const j = jugada(c);

  if (acc === "copia" || acc === "wa" || acc === "correo") {
    if (acc === "copia") {
      try { await navigator.clipboard.writeText(j.guion); aviso("Texto copiado"); }
      catch (e) { aviso("Selecciona el texto y cópialo a mano."); }
      return;
    }
    const url = acc === "wa" ? waLink(c, j.guion)
      : "mailto:" + encodeURIComponent(c.correo || "") +
        "?subject=" + encodeURIComponent("Hey Makers · " + c.taller) +
        "&body=" + encodeURIComponent(j.guion);
    if (!abreFuera(url)) {
      try { await navigator.clipboard.writeText(j.guion); } catch (e) {}
      aviso("Tu navegador no dejó abrir " + (acc === "wa" ? "WhatsApp" : "el correo") + ". El texto ya quedó copiado.");
    }
    return;
  }
  if (acc === "agenda") { const el = $("#qFecha"); if (el) { el.focus(); el.scrollIntoView({ block: "center" }); } return; }
  if (acc === "guardafiscal") {
    const pide = $("#fxPide").value === "si";
    if (pide) {
      const rfc = ($("#fxRfc").value || "").trim().toUpperCase();
      const razon = ($("#fxRazon").value || "").trim().toUpperCase();
      const cp = ($("#fxCp").value || "").trim();
      if (rfc.length < 12 || !razon || cp.length !== 5) { aviso("Revisa el RFC, la razón social y el código postal."); return; }
      c.requiereFactura = true; c.rfc = rfc; c.razon = razon; c.cp = cp;
      c.regimen = $("#fxRegimen").value; c.uso = $("#fxUso").value;
      anota(c, "Pidió factura. RFC " + rfc + ", régimen " + c.regimen + ".");
      const suyos = ficheros.cobros.filter(x => x.cuentaId === c.id && x.estado === "aprobado" &&
        x.factura === "global" && x.fecha.slice(0, 7) === iso(HOY).slice(0, 7));
      await guarda("cuentas", c);
      let n = 0;
      for (const x of suyos) { x.factura = "pendiente"; await guarda("cobros", x); n++; }
      abreFicha(c.id);
      aviso(n ? "Guardado. " + n + " pago(s) de este mes quedaron por facturar." : "Datos fiscales guardados");
    } else {
      c.requiereFactura = false;
      anota(c, "Ya no pide factura: sus pagos entran en la global.");
      await guarda("cuentas", c); abreFicha(c.id); aviso("Guardado");
    }
    return;
  }
  if (acc === "guardacita") {
    const f = $("#qFecha").value, h = $("#qHora").value;
    if (!f || !h) { aviso("Falta el día o la hora."); return; }
    await guarda("citas", { id: uid(), cuentaId: c.id, tipo: $("#qTipo").value, fecha: f, hora: h,
      quien: $("#qQuien").value, motivo: j.titulo, estado: "pendiente", resultado: "" });
    anota(c, TIPOCITA[$("#qTipo").value] + " agendada para el " + fFecha(f) + " a las " + h + ": " + j.titulo.toLowerCase() + ".");
    await guarda("cuentas", c); abreFicha(c.id); aviso("Agendada para el " + fFecha(f)); return;
  }
  if (acc === "ticket") {
    const asunto = prompt("¿Qué problema reporta " + c.taller + "?"); if (!asunto) return;
    await guarda("tickets", { id: uid(), cuentaId: c.id, asunto: asunto.trim(), prioridad: "normal", estado: "abierto",
      creado: iso(HOY), mensajes: [{ de: "cliente", txt: asunto.trim(), f: iso(HOY) }] });
    anota(c, "Se abrió un ticket a su nombre: " + asunto.trim());
    await guarda("cuentas", c); abreFicha(c.id); aviso("Ticket abierto"); return;
  }
  if (acc === "apoyo") {
    const quien = prompt("¿Quién va a entrar? (queda registrado)", "Soporte de turno"); if (!quien) return;
    c.apoyo = { hasta: iso(HOY), quien: quien.trim(), desde: iso(HOY) };
    anota(c, "El cliente autorizó acceso de apoyo por 2 horas para " + quien.trim() + ".");
    await guarda("cuentas", c); abreFicha(c.id); aviso("Acceso abierto, queda registrado"); return;
  }
  if (acc === "cierraapoyo") {
    anota(c, "Se cerró el acceso de apoyo de " + (c.apoyo || {}).quien + ".");
    c.apoyo = null; await guarda("cuentas", c); abreFicha(c.id); return;
  }

  if (acc === "mas7" || acc === "mas15") {
    const n = acc === "mas7" ? 7 : 15;
    c.vence = iso(masDias(dObj(c.vence < iso(HOY) ? iso(HOY) : c.vence), n));
    if (c.estado === "vencida") c.estado = "prueba";
    anota(c, "Se le dieron " + dias(n) + " más. Ahora vence el " + fFecha(c.vence) + ".");
    aviso("Vence el " + fFecha(c.vence));
  } else if (acc === "pausa") { c.estado = "pausada"; anota(c, "Cuenta pausada. Los datos se conservan.");
  } else if (acc === "reactiva") {
    c.estado = "activa"; c.baja = null; c.vence = iso(masDias(HOY, 30));
    anota(c, "Cuenta reactivada. Siguiente cobro el " + fFecha(c.vence) + ".");
  } else if (acc === "cobra") {
    c.estado = "activa"; c.vence = iso(masDias(HOY, c.periodo === "anual" ? 365 : 30));
    anota(c, "Pasó de prueba a " + planDe(c).nombre + " " + c.periodo + ".");
    aviso("Bien: " + c.taller + " ya está pagando");
  } else if (acc === "baja") {
    if (!confirm("¿Dar de baja a " + c.taller + "? Deja de cobrarse, pero sus datos se conservan.")) return;
    c.estado = "baja"; c.baja = iso(HOY); anota(c, "Se dio de baja la cuenta.");
  } else if (acc === "nota") {
    const t = ($("#fNota").value || "").trim();
    if (!t) { aviso("Escribe la nota antes de guardarla."); return; }
    anota(c, t); aviso("Nota guardada");
  }
  await guarda("cuentas", c);
  abreFicha(c.id);
}

/* ================= pintar ================= */
function pinta() {
  const titulos = { tablero: "Tablero", cuentas: "Cuentas", agenda: "Agenda", soporte: "Soporte",
    cobros: "Cobros y facturación", codigos: "Códigos de curso", diagnosticos: "Qué pide quien llega", equipo: "Equipo y alianzas", numeros: "Números" };
  $("#titulo").textContent = titulos[vista];
  $("#n_cuentas").textContent = ficheros.cuentas.length;
  $("#n_agenda").textContent = citasHoy().length;
  $("#n_agenda").className = "cuenta" + (citasHoy().length ? " urge" : "");
  const sop = ficheros.tickets.filter(t => t.estado !== "resuelto").length +
              ficheros.fallas.filter(f => f.estado !== "verificada" && f.severidad === "bloquea").length;
  $("#n_soporte").textContent = sop;
  const rech = ficheros.cobros.filter(p => p.estado === "rechazado").length;
  $("#n_cobros").textContent = rech;
  $("#n_cobros").className = "cuenta" + (rech ? " urge" : "");
  $("#avisoDemo").hidden = !esEjemplo;
  ["busca", "filtroEstado", "filtroPlan", "btnNueva"].forEach(i => { $("#" + i).hidden = vista !== "cuentas"; });
  document.querySelectorAll("#nav button").forEach(b => b.setAttribute("aria-current", String(b.dataset.v === vista)));
  if (!listo) { $("#vista").innerHTML = '<div class="tarjeta"><div class="vacio">Cargando tus cuentas…</div></div>'; return; }
  $("#vista").innerHTML = vista === "tablero" ? vTablero() : vista === "cuentas" ? vCuentas()
    : vista === "agenda" ? vAgenda() : vista === "soporte" ? vSoporte()
    : vista === "cobros" ? vCobros() : vista === "codigos" ? vCodigos()
    : vista === "diagnosticos" ? vDiagnosticos()
    : vista === "equipo" ? vEquipo() : vNumeros();
  ponGlobos();
}

function ponGlobos() {
  const d = historico(6);
  document.querySelectorAll("rect.barra").forEach(r => {
    r.addEventListener("mouseenter", () => {
      const p = d[+r.dataset.i]; if (!p) return;
      const g = document.createElement("div"); g.className = "globo"; g.id = "globoBarra";
      g.innerHTML = p.et + "<br><b class='num'>" + $$$(p.v) + " al mes</b>";
      document.body.appendChild(g);
      const b = r.getBoundingClientRect();
      g.style.left = Math.max(8, Math.min(window.innerWidth - g.offsetWidth - 8, b.left + b.width / 2 - g.offsetWidth / 2)) + "px";
      g.style.top = Math.max(8, b.top - g.offsetHeight - 8) + "px";
    });
    r.addEventListener("mouseleave", () => { const g = document.getElementById("globoBarra"); if (g) g.remove(); });
  });
}

/* ================= eventos ================= */
$("#nav").addEventListener("click", e => {
  const b = e.target.closest("button[data-v]"); if (!b) return;
  vista = b.dataset.v; pinta();
});
$("#telon").addEventListener("click", cierraPanel);
document.addEventListener("keydown", e => { if (e.key === "Escape") cierraPanel(); });

document.addEventListener("click", async e => {
  if (e.target.closest("a[href]")) { if (e.target.closest("[data-abre],[data-tick]")) e.stopPropagation(); return; }
  if (e.target.closest("#cerrarFicha")) { cierraPanel(); return; }

  const cita = e.target.closest("[data-cita]");
  if (cita) {
    const q = ficheros.citas.find(x => x.id === cita.dataset.id); if (!q) return;
    if (cita.dataset.cita === "borra") { await elimina("citas", q.id); aviso("Cita quitada"); return; }
    q.estado = cita.dataset.cita;
    if (q.estado === "hecha") {
      const r = prompt("¿Cómo te fue? (queda en la cuenta)", "");
      q.resultado = (r || "").trim();
      const c = cuentaDe(q.cuentaId);
      if (c) { anota(c, TIPOCITA[q.tipo] + " del " + fFecha(q.fecha) + ": " + (q.resultado || "sin nota")); await guarda("cuentas", c); }
    }
    await guarda("citas", q); return;
  }

  const emite = e.target.closest("[data-emite]");
  if (emite) { await emiteCFDI(emite.dataset.emite); return; }

  const pide = e.target.closest("[data-pide]");
  if (pide) {
    const p = ficheros.cobros.find(x => x.id === pide.dataset.pide); if (!p) return;
    if (p.fecha.slice(0, 7) !== iso(HOY).slice(0, 7)) {
      aviso("Ese pago es de un mes anterior: ya se fue en la global de ese mes."); return;
    }
    const c = cuentaDe(p.cuentaId);
    if (!c) return;
    if (!c.rfc || !c.razon || !c.cp || !c.regimen) {
      aviso("Captura primero sus datos fiscales."); abreFicha(c.id); return;
    }
    if (!c.requiereFactura) { c.requiereFactura = true; anota(c, "Pidió factura después del pago."); await guarda("cuentas", c); }
    await emiteCFDI(p.id);
    return;
  }

  const sub2 = e.target.closest("[data-sub]");
  if (sub2) { subSop = sub2.dataset.sub; pinta(); return; }

  const per = e.target.closest("[data-persona]");
  if (per) { abrePersona(per.dataset.persona); return; }

  const acc2 = e.target.closest("[data-acceso]");
  if (acc2) {
    const x = eqDe(acc2.dataset.acceso); if (!x) return;
    x.activo = x.activo === false;
    await guarda("equipo", x); abrePersona(x.id);
    aviso(x.activo ? "Ya puede entrar otra vez" : "Se le quitó el acceso"); return;
  }

  const pasa = e.target.closest("[data-pasa]");
  if (pasa) {
    const de = eqDe(pasa.dataset.pasa), aId = $("#pPasa") ? $("#pPasa").value : "";
    if (!de || !aId) { aviso("Elige primero a quién se lo pasas."); return; }
    const a = eqDe(aId); if (!a) return;
    if (!confirm("¿Pasarle a " + a.nombre + " todas las cuentas, citas y tickets de " + de.nombre + "?")) return;
    let n = 0;
    for (const c of ficheros.cuentas.filter(c => c.cerradoPor === de.id)) {
      c.cerradoPor = a.id; anota(c, "Pasó de " + de.nombre + " a " + a.nombre + "."); await guarda("cuentas", c); n++;
    }
    for (const q of ficheros.citas.filter(q => q.quien === de.id && q.estado === "pendiente")) { q.quien = a.id; await guarda("citas", q); n++; }
    for (const t of ficheros.tickets.filter(t => t.atiende === de.id && t.estado !== "resuelto")) { t.atiende = a.id; await guarda("tickets", t); n++; }
    for (const f of ficheros.fallas.filter(f => f.quien === de.id && f.estado !== "verificada")) { f.quien = a.id; await guarda("fallas", f); n++; }
    abrePersona(de.id); aviso(n === 1 ? "Una cosa pasó a " + a.nombre : n + " cosas pasaron a " + a.nombre); return;
  }

  const vf = e.target.closest("[data-falla]");
  if (vf) { abreFalla(vf.dataset.falla); return; }

  const nf = e.target.closest("[data-nuevafalla]");
  if (nf) {
    const x = ficheros.errores.find(z => z.id === nf.dataset.nuevafalla); if (!x) return;
    const f = { id: uid(), titulo: x.donde + ": " + x.mensaje, donde: x.donde, severidad: "molesta",
      estado: "reportada", version: "", sintoma: x.mensaje,
      reproducir: "Detectado automáticamente " + x.veces + (x.veces === 1 ? " vez" : " veces") + " en " + x.navegador +
        ", perfil " + x.rol + ", versión " + x.version + ". Falta reproducirlo a mano.",
      reportada: iso(HOY), confirmada: null, corregida: null, verificada: null, quien: null, avisados: false, notas: [] };
    await guarda("fallas", f);
    x.fallaId = f.id; await guarda("errores", x);
    abreFalla(f.id); aviso("Falla registrada"); return;
  }

  const esc2 = e.target.closest("[data-escala]");
  if (esc2) {
    const t = ficheros.tickets.find(x => x.id === esc2.dataset.escala); if (!t) return;
    const c = cuentaDe(t.cuentaId) || {};
    const f = { id: uid(), titulo: t.asunto, donde: "Por ubicar", severidad: "molesta", estado: "reportada", version: "",
      sintoma: (t.mensajes[0] || {}).txt || t.asunto,
      reproducir: "Reportado por " + (c.taller || "un cliente") + " en " + (c.navegador || "navegador sin registrar") +
        ", versión " + (c.version || "?") + ". Falta escribir los pasos exactos.",
      reportada: iso(HOY), confirmada: null, corregida: null, verificada: null, quien: null, avisados: false, notas: [] };
    await guarda("fallas", f);
    t.fallaId = f.id; await guarda("tickets", t);
    abreFalla(f.id); aviso("Queda registrada como falla del programa"); return;
  }

  const sug = e.target.closest("[data-sug]");
  if (sug) { await sugiere(sug.dataset.sug); return; }

  const fx = e.target.closest("[data-fx]");
  if (fx) { await accionFalla(fx.dataset.fx); return; }

  const tick = e.target.closest("[data-tick]"); if (tick) { abreTicket(tick.dataset.tick); return; }
  const abre = e.target.closest("[data-abre]"); if (abre) { abreFicha(abre.dataset.abre); return; }
  const acc = e.target.closest("[data-acc]"); if (acc) { accion(acc.dataset.acc); return; }

  const tk = e.target.closest("[data-tk]");
  if (tk) {
    const t = ficheros.tickets.find(x => x.id === tk.dataset.id); if (!t) return;
    const q = tk.dataset.tk;
    if (q === "responde") {
      const txt = ($("#tkResp").value || "").trim();
      if (!txt) { aviso("Escribe la respuesta primero."); return; }
      t.mensajes = t.mensajes.concat([{ de: "soporte", txt: txt, f: ahoraSello() }]);
      if (!t.primeraResp) t.primeraResp = ahoraSello();
      if (!t.atiende) t.atiende = (ficheros.equipo.find(x => x.rol === "soporte") || ficheros.equipo[0] || {}).id || null;
      t.estado = "encurso";
      aviso(slaTicket(t).respOk === false ? "Enviada, pero tardó más de " + META_RESP + " h en contestarse" : "Respuesta enviada");
    } else if (q === "resuelto") {
      if (!t.primeraResp) t.primeraResp = ahoraSello();
      t.resuelto = ahoraSello(); t.estado = "esperando";
      aviso("Queda en espera de que el cliente confirme");
    } else if (q === "confirma") {
      t.confirmado = ahoraSello(); t.estado = "resuelto";
      const c = cuentaDe(t.cuentaId);
      if (c) { anota(c, "Se cerró el ticket \"" + t.asunto + "\" con su confirmación. Tardó " + fDur(horasEntre(t.creado, t.confirmado)) + "."); await guarda("cuentas", c); }
      aviso("Cerrado. Tardó " + fDur(horasEntre(t.creado, t.confirmado)));
    } else if (q === "niega") {
      t.resuelto = null; t.estado = "encurso"; t.reaperturas = (t.reaperturas || 0) + 1;
      t.mensajes = t.mensajes.concat([{ de: "cliente", txt: "Todavía no queda.", f: ahoraSello() }]);
      aviso("Reabierto. El reloj nunca se reinició.");
    } else if (q === "reabre") {
      t.estado = "encurso"; t.resuelto = null; t.confirmado = null; t.reaperturas = (t.reaperturas || 0) + 1;
    }
    await guarda("tickets", t); abreTicket(t.id);
    return;
  }

  const err = e.target.closest("[data-err]");
  if (err) {
    const x = ficheros.errores.find(z => z.id === err.dataset.err); if (!x) return;
    x.estado = x.estado === "abierto" ? "revisando" : x.estado === "revisando" ? "resuelto" : "abierto";
    await guarda("errores", x); return;
  }

  const quita = e.target.closest("[data-quita]");
  if (quita) { await elimina("equipo", quita.dataset.quita); aviso("Se quitó del equipo"); return; }

  if (e.target.closest("#eqAlta")) {
    const n = ($("#eqNombre").value || "").trim(), co = ($("#eqCorreo").value || "").trim();
    if (!n || co.indexOf("@") < 0) { aviso("Falta el nombre o el correo."); return; }
    const tipo = $("#eqCom").value;
    await guarda("equipo", { id: uid(), nombre: n, correo: co, rol: $("#eqRol").value,
      comision: { tipo: tipo, valor: tipo === "primermes" ? 100 : tipo === "recurrente" ? 10 : 0 } });
    aviso("Listo, ya tiene acceso"); return;
  }
  if (e.target.closest("#alAlta")) {
    const n = ($("#alNombre").value || "").trim();
    if (!n) { aviso("Escribe el nombre del organismo."); return; }
    const cod = n.toUpperCase().replace(/[^A-Z]/g, "").slice(0, 8);
    await guarda("alianzas", { id: uid(), nombre: n, tipo: "Organismo del sector",
      contacto: "", codigo: cod, trato: ($("#alTrato").value || "").trim() || "Por definir", vigencia: "por firmar" });
    aviso("Su código es " + cod); return;
  }
  if (e.target.closest("#btnNueva")) { nuevaCuenta(); return; }
  if (e.target.closest("#btnExporta")) { exporta(); return; }
  if (e.target.closest("#btnBorrar")) { borraEjemplo(); return; }
});

document.addEventListener("change", async e => {
  const pid = e.target.closest("[data-pid]");
  if (pid) {
    const x = eqDe(pid.dataset.pid); if (!x) return;
    if (e.target.id === "pRol") x.rol = e.target.value;
    if (e.target.id === "pCom") {
      const t = e.target.value;
      x.comision = { tipo: t, valor: t === "primermes" ? 100 : t === "recurrente" ? 10 : 0 };
    }
    await guarda("equipo", x); abrePersona(x.id); return;
  }
  const fxid = e.target.closest("[data-fxid]");
  if (fxid) {
    const f = fallaDe(fxid.dataset.fxid); if (!f) return;
    if (e.target.id === "fxSev") f.severidad = e.target.value;
    if (e.target.id === "fxQuien") f.quien = e.target.value || null;
    await guarda("fallas", f); abreFalla(f.id); return;
  }
  const liga = e.target.closest("[data-liga]");
  if (liga) {
    const t = ficheros.tickets.find(x => x.id === liga.dataset.liga); if (!t || !e.target.value) return;
    t.fallaId = e.target.value;
    await guarda("tickets", t); abreTicket(t.id);
    aviso("Ligado a: " + (fallaDe(e.target.value) || {}).titulo); return;
  }
  const tq = e.target.closest("[data-tkq]");
  if (tq) {
    const t = ficheros.tickets.find(x => x.id === tq.dataset.tkq); if (!t) return;
    t.atiende = e.target.value || null;
    await guarda("tickets", t); abreTicket(t.id);
    aviso(t.atiende ? "Asignado a " + (eqDe(t.atiende) || {}).nombre : "Sin asignar");
    return;
  }
  if (["cfRfc","cfRazon","cfRegimen","cfSerie","cfIva","cfModo"].indexOf(e.target.id) >= 0) {
    if (e.target.id === "cfRfc") CFG.rfc = e.target.value.trim().toUpperCase();
    if (e.target.id === "cfRazon") CFG.razon = e.target.value.trim();
    if (e.target.id === "cfRegimen") CFG.regimen = e.target.value;
    if (e.target.id === "cfIva") CFG.iva = +e.target.value;
    if (e.target.id === "cfModo") CFG.ivaIncluido = e.target.value === "si";
    if (e.target.id === "cfSerie") {
      const t = e.target.value.split("-");
      CFG.serie = (t[0] || "A").trim(); CFG.folio = parseInt(t[1], 10) || CFG.folio;
    }
    await guardaCfg(); pinta();
    if (e.target.id === "cfModo") aviso(CFG.ivaIncluido ? "Los precios ya traen IVA" : "Ahora los precios son más IVA");
    return;
  }
  if (!abierta) return;
  const c = cuentaDe(abierta); if (!c) return;
  if (e.target.id === "fPlan") {
    const antes = planDe(c).nombre; c.plan = e.target.value;
    anota(c, "Cambió de " + antes + " a " + planDe(c).nombre + ".");
    await guarda("cuentas", c); abreFicha(c.id); aviso("Ahora es plan " + planDe(c).nombre);
  } else if (e.target.id === "fPeriodo") {
    c.periodo = e.target.value; anota(c, "Pasó a pago " + c.periodo + ".");
    await guarda("cuentas", c); abreFicha(c.id);
  }
});

async function exporta() {
  const cab = ["Taller","Ciudad","Contacto","Correo","Telefono","Estado","Plan","Periodo","Al mes","Alta","Vence",
    "Ultimo acceso","Cotizaciones","Origen","La cerro","Que sigue","Pide factura","RFC"];
  const filas = ficheros.cuentas.map(c => [c.taller, c.sitio, c.contacto, c.correo, c.tel, ESTADOS[c.estado].nombre,
    planDe(c).nombre, c.periodo, paga(c) ? Math.round(mensual(c)) : 0, c.alta, c.vence, c.ultimo, c.cotizaciones,
    c.alianza ? (aliDe(c.alianza) || {}).nombre : ORIGENES[c.origen],
    c.cerradoPor ? (eqDe(c.cerradoPor) || {}).nombre : "", jugada(c).titulo,
    c.requiereFactura ? "Sí" : "No", c.rfc]);
  const csv = "﻿" + [cab].concat(filas).map(f => f.map(v => '"' + String(v == null ? "" : v).replace(/"/g, '""') + '"').join(",")).join("\r\n");
  let d = null;
  try { d = await (window.claude && window.claude.use ? window.claude.use("downloads") : null); } catch (e) { d = null; }
  if (!d) { aviso("La descarga no está disponible en esta vista."); return; }
  try { await d.save({ filename: "cuentas-makerslab-" + iso(HOY) + ".csv", data: csv }); aviso("Archivo listo"); }
  catch (e) { aviso("No se descargó el archivo."); }
}

      '<div id="cgResultado"></div>' +
      '</div></div>' +

    '<div class="tarjeta"><header><h2>Tus códigos</h2>' +
      '<span class="pista">' + vivos.length + ' en uso de ' + cs.length + '</span></header>' +
      (cs.length ? '<table class="tabla"><thead><tr><th>Código</th><th>Curso</th><th>Da</th>' +
        '<th>Usos</th><th>Cuentas</th><th>Sirve hasta</th><th></th></tr></thead><tbody>' +

          '<td>' + c.usos + (c.usos_max ? ' de ' + c.usos_max : ' · sin tope') + '</td>' +
          '<td>' + cuentasPorCodigo(c) + '</td>' +
          '<td>' + (c.vence ? fFecha(String(c.vence).slice(0,10)) : "siempre") + '</td>' +
          '<td><button class="btn sm" data-cg="' + esc(c.codigo) + '">' +

      : '<div class="cuerpo"><div class="vacio">Todavía no has abierto ningún curso. ' +

document.addEventListener("click", async e => {
  if (e.target.closest("#cgCrear")) {
    const curso = ($("#cgCurso").value || "").trim();
    if (!curso) { aviso("Escribe de qué curso es, para que sepas cuál es cuál después."); return; }
    const b = e.target.closest("#cgCrear");
    b.disabled = true; b.textContent = "Generando…";
    try {
      const r = await SB.rpc("nuevo_codigo", {
        p_curso: curso,
        p_lugares: Math.max(0, parseInt($("#cgLugares").value || "0", 10)),
        p_dias: Math.max(1, parseInt($("#cgDias").value || "15", 10)),
        p_plan: $("#cgPlan").value
      });
      if (r.error) throw new Error(r.error.message);
      const d = r.data || {};
      $("#cgCurso").value = "";
      // Primero repintamos la lista, porque eso rehace la tarjeta entera y
      // borraría el código recién generado si lo escribiéramos antes.
      await recarga("codigos");
      $("#cgResultado").innerHTML =
        '<div class="bloque" style="margin-top:14px;border-color:var(--bien)">' +
        '<h3>Listo, dicta este código</h3>' +
        '<p style="font-family:ui-monospace,monospace;font-size:30px;font-weight:600;' +
        'letter-spacing:.1em;margin:8px 0">' + esc(d.codigo) + '</p>' +
        '<p class="porque">Para ' + esc(d.curso) + '. Cada alumno que lo use entra con plan ' +

        '<button class="btn sm" id="cgCopiar">Copiar</button></div>';
      const bc = $("#cgCopiar");
      if (bc) bc.addEventListener("click", () => {
        navigator.clipboard && navigator.clipboard.writeText(d.codigo)
          .then(() => aviso("Código copiado"), () => aviso("No se pudo copiar"));
      });
    } catch (err) { aviso(err.message); }
    finally { b.disabled = false; b.textContent = "Generar el código"; }
    return;
  }
  const cg = e.target.closest("[data-cg]");
  if (cg) {
    const c = (ficheros.codigos || []).find(x => x.codigo === cg.dataset.cg);
    if (!c) return;
    try {
      const r = await SB.rpc("staff_codigo_activo", {p_codigo: c.codigo, p_activo: !c.activo});
      if (r.error) throw new Error(r.error.message);
      aviso(c.activo ? "Código cerrado" : "Código reabierto");
      await recarga("codigos");
    } catch (err) { aviso(err.message); }
  }
});

/* Vuelve a leer una colección y repinta, sin esperar al refresco de cada minuto. */
async function recarga(col) {
  if (!DB) return;
  try {
    const snap = await DB.collection(col).get();
    ficheros[col] = snap.docs.map(d => Object.assign({id: d.id}, d.data()));
    pinta();
  } catch (e) {}
}


/* ================= qué pide quien llega =================
   Las seis preguntas que contesta la gente antes de elegir plan. Esto no
   se lee renglón por renglón: se lee de arriba, en los totales. Si de
   cuarenta respuestas treinta dicen que cotizan en Excel, eso vale más
   que cualquier corazonada sobre el mercado. */
function vDiagnosticos() {
  const ds = ficheros.diagnosticos || [];
  if (!ds.length) return '<div class="tarjeta"><header><h2>Qué pide quien llega</h2></header>' +
    '<div class="cuerpo"><div class="vacio">Todavía nadie ha contestado el cuestionario. ' +
    'Aparece cuando alguien se registra sin código y le da a "Ver los planes".</div></div></div>';

  const contrataron = ds.filter(d => d.eligio);
  const atinamos = ds.filter(d => d.eligio && d.eligio === d.recomendado);

  /* Cuenta cuántas veces sale cada respuesta. Sirve igual para las de una
     sola opción que para las de varias, porque las de varias llegan como
     lista y se cuenta cada elemento. */
  const cuenta = (campo, mapa) => {
    const t = {};
    ds.forEach(d => {
      const v = d[campo];
      (Array.isArray(v) ? v : [v]).forEach(x => { if (x) t[x] = (t[x] || 0) + 1; });
    });
    return Object.keys(t).sort((a, b) => t[b] - t[a])
      .map(k => ({ k: (mapa && mapa[k]) || k, n: t[k], pc: Math.round(100 * t[k] / ds.length) }));
  };

  const barras = (titulo, filas) =>
    '<div class="tarjeta"><header><h3 style="margin:0;font-size:14px">' + titulo + '</h3></header>' +
    '<div class="cuerpo">' + filas.map(f =>
      '<div style="margin-bottom:9px">' +
      '<div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:3px">' +
        '<span>' + esc(f.k) + '</span><b>' + f.n + ' · ' + f.pc + '%</b></div>' +
      '<div style="height:6px;background:var(--surface-3);border-radius:3px;overflow:hidden">' +
        '<i style="display:block;height:100%;width:' + f.pc + '%;background:var(--acento)"></i></div>' +
      '</div>').join("") + '</div></div>';

  const NOM_GENTE  = {"1":"Solo él/ella", "2a3":"Dos o tres", "4mas":"Cuatro o más"};
  const NOM_COTIZA = {pocas:"Menos de 10 al mes", medias:"Entre 10 y 50", muchas:"Más de 50"};
  const NOM_COMO   = {memoria:"De memoria", papel:"Papel y calculadora", excel:"En Excel", otro:"Otro programa"};
  const NOM_DONDE  = {curso:"Curso Hey Makers", redes:"Redes sociales", recomendado:"Recomendación", internet:"Buscando"};
  const NOM_HACE   = {playeras:"Playeras y ropa", gorras:"Gorras", tazas:"Tazas", bordado:"Bordado", otros:"Otras cosas"};
  const NOM_NEC    = {compras:"Pedir material", inventario:"Inventario", factura:"Facturar",
                      utilidad:"Saber su utilidad", caja:"Corte de caja"};

  const masSugerido = (function () {
    const c = cuenta("recomendado", { basico: "Básico", maker: "Maker", pro: "Pro" });
    return c.length ? c[0].k : "—";
  })();

  return '<div style="display:flex;flex-direction:column;gap:20px">' +
    '<div class="tiles">' +
      tile("Contestaron", ds.length, "el cuestionario completo o parte", true) +
      tile("Contrataron", contrataron.length,
           (ds.length ? Math.round(100 * contrataron.length / ds.length) : 0) + "% de los que contestan") +
      tile("Le atinamos", atinamos.length,
           (contrataron.length ? Math.round(100 * atinamos.length / contrataron.length) : 0) +
           "% eligió el que le sugerimos") +
      tile("Más sugerido", masSugerido, "de los tres planes") +
    '</div>' +

    '<div class="rejilla2">' +
      barras("Qué personalizan", cuenta("que_hace", NOM_HACE)) +
      barras("Qué les hace falta", cuenta("que_necesita", NOM_NEC)) +
      barras("Cuántos son", cuenta("gente", NOM_GENTE)) +
      barras("Cuánto cotizan", cuenta("cotizaciones_mes", NOM_COTIZA)) +
      barras("Cómo cotizan hoy", cuenta("como_cotiza_hoy", NOM_COMO)) +
      barras("De dónde llegan", cuenta("de_donde_llego", NOM_DONDE)) +
    '</div>' +

    '<div class="tarjeta"><header><h2>Uno por uno</h2>' +
      '<span class="pista">los últimos ' + Math.min(ds.length, 40) + '</span></header>' +
      '<table class="tabla"><thead><tr><th>Cuándo</th><th>Correo</th><th>Son</th>' +
      '<th>Cotiza</th><th>Necesita</th><th>Le dijimos</th><th>Eligió</th></tr></thead><tbody>' +
      ds.slice(0, 40).map(d =>
        '<tr><td>' + fCorta(String(d.creado).slice(0, 10)) + '</td>' +
        '<td>' + esc(d.correo || "—") + '</td>' +
        '<td>' + esc(NOM_GENTE[d.gente] || "—") + '</td>' +
        '<td>' + esc(NOM_COTIZA[d.cotizaciones_mes] || "—") + '</td>' +
        '<td>' + esc((d.que_necesita || []).map(x => NOM_NEC[x] || x).join(", ") || "nada en especial") + '</td>' +
        '<td>' + esc((PLANES[d.recomendado] || {}).nombre || "—") + '</td>' +
        '<td>' + (d.eligio
            ? '<span class="chip bien">' + esc((PLANES[d.eligio] || {}).nombre || d.eligio) + '</span>'
            : '<span class="chip gris">todavía no</span>') + '</td></tr>').join("") +
      '</tbody></table></div>' +
    '</div>';
}

</script>

<script>
(function(){
  var mio = "20261002-1816";
  /* Un solo reintento por versión: si el servidor insistiera en
     mandar la vieja, mejor una página vieja que un parpadeo eterno. */
  function yaLoIntente(v){ try{ return sessionStorage.getItem("hm-recarga") === v; }catch(e){ return false; } }
  function anota(v){ try{ sessionStorage.setItem("hm-recarga", v); }catch(e){} }
  function revisa(){
    fetch("version.json?t=" + Date.now(), {cache:"no-store"})
      .then(function(r){ return r.ok ? r.json() : null; })
      .then(function(d){
        var suyo = d["lab"] || d.build;
        if(!suyo || suyo === mio) return;
        if(yaLoIntente(suyo)) return;
        anota(suyo);
        var base = location.pathname.split("?")[0];
        location.replace(base + "?v=" + suyo);
      })
      .catch(function(){});
  }
  setTimeout(revisa, 1500);
  document.addEventListener("visibilitychange", function(){ if(!document.hidden) revisa(); });
})();
</script>
